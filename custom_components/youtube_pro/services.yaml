play:
  name: Phát URL YouTube
  description: Resolve và phát một URL YouTube trên media_player qua playback engine của add-on.
  fields:
    config_entry_id:
      name: Config entry
      description: Chỉ cần khi có nhiều instance; để trống sẽ dùng instance đang tải đầu tiên.
      selector:
        config_entry:
          integration: youtube_pro
    entity_id:
      name: Thiết bị phát
      required: true
      selector:
        entity:
          domain: media_player
    url:
      name: URL YouTube
      required: true
      selector:
        text:
          type: url
    title:
      name: Tiêu đề
      selector:
        text:
    media_kind:
      name: Loại nội dung
      default: audio
      selector:
        select:
          options:
            - audio
            - video
    repeat:
      name: Chế độ lặp
      default: "off"
      selector:
        select:
          options:
            - "off"
            - all
            - one
    shuffle:
      name: Phát ngẫu nhiên
      default: false
      selector:
        boolean:

play_playlist:
  name: Phát playlist add-on
  description: Phát playlist đã lưu trong YouTube Pro trên media_player.
  fields:
    config_entry_id:
      name: Config entry
      selector:
        config_entry:
          integration: youtube_pro
    entity_id:
      name: Thiết bị phát
      required: true
      selector:
        entity:
          domain: media_player
    playlist_name:
      name: Tên playlist
      required: true
      selector:
        text:
    index:
      name: Vị trí bắt đầu
      default: 0
      selector:
        number:
          min: 0
          max: 999
          mode: box
    repeat:
      name: Chế độ lặp
      default: all
      selector:
        select:
          options:
            - "off"
            - all
            - one
    shuffle:
      name: Phát ngẫu nhiên
      default: false
      selector:
        boolean:

enqueue:
  name: Thêm vào hàng chờ
  description: Thêm URL YouTube vào phiên phát của loa hoặc hàng chờ chung.
  fields:
    config_entry_id:
      name: Config entry
      selector:
        config_entry:
          integration: youtube_pro
    entity_id:
      name: Thiết bị phát (tùy chọn)
      description: Nếu loa đang có phiên phát, bài sẽ vào đúng danh sách tiếp theo.
      selector:
        entity:
          domain: media_player
    url:
      name: URL YouTube
      required: true
      selector:
        text:
          type: url
    title:
      name: Tiêu đề
      selector:
        text:
    media_kind:
      name: Loại nội dung
      default: audio
      selector:
        select:
          options:
            - audio
            - video
    position:
      name: Vị trí
      default: end
      selector:
        select:
          options:
            - label: Phát tiếp theo
              value: next
            - label: Thêm cuối hàng chờ
              value: end

start_radio:
  name: Tạo đài phát YouTube
  description: Tạo danh sách đề xuất từ một bài và phát tiếp tự động trên loa.
  fields:
    config_entry_id:
      name: Config entry
      selector:
        config_entry:
          integration: youtube_pro
    entity_id:
      name: Thiết bị phát
      required: true
      selector:
        entity:
          domain: media_player
    url:
      name: URL YouTube
      required: true
      selector:
        text:
          type: url
    title:
      name: Tiêu đề bài gốc
      selector:
        text:
    media_kind:
      name: Loại nội dung
      default: audio
      selector:
        select:
          options:
            - audio
            - video
    mode:
      name: Cách thêm
      default: replace
      selector:
        select:
          options:
            - label: Thay hàng chờ tiếp theo
              value: replace
            - label: Nối vào cuối
              value: append
    limit:
      name: Số đề xuất
      default: 24
      selector:
        number:
          min: 5
          max: 30
          mode: box
    profile_id:
      name: Hồ sơ nghe
      description: ID hồ sơ local dùng để cá nhân hóa đài phát.
      selector:
        text:

set_timer:
  name: Đặt lịch phát
  description: Tạo hoặc cập nhật lịch phát/dừng trong add-on.
  fields:
    config_entry_id:
      name: Config entry
      selector:
        config_entry:
          integration: youtube_pro
    id:
      name: ID lịch
      description: Để trống để tạo lịch mới; dùng lại ID để cập nhật lịch hiện có.
      selector:
        text:
    entity_id:
      name: Thiết bị phát
      required: true
      selector:
        entity:
          domain: media_player
    time:
      name: Thời gian
      required: true
      selector:
        time:
    action:
      name: Hành động
      default: play
      selector:
        select:
          options:
            - play
            - stop
    playlist_name:
      name: Tên playlist
      description: Bắt buộc khi hành động là play.
      selector:
        text:
    days:
      name: Ngày chạy
      description: Bỏ trống để chạy mỗi ngày; 0 là thứ Hai và 6 là Chủ nhật.
      selector:
        select:
          multiple: true
          options:
            - label: Thứ Hai
              value: "0"
            - label: Thứ Ba
              value: "1"
            - label: Thứ Tư
              value: "2"
            - label: Thứ Năm
              value: "3"
            - label: Thứ Sáu
              value: "4"
            - label: Thứ Bảy
              value: "5"
            - label: Chủ nhật
              value: "6"
    shuffle:
      name: Phát ngẫu nhiên
      default: true
      selector:
        boolean:
    enabled:
      name: Kích hoạt
      default: true
      selector:
        boolean:
    duration:
      name: Tự dừng sau
      description: Số phút, đặt 0 để không tự dừng.
      default: 0
      selector:
        number:
          min: 0
          max: 720
          unit_of_measurement: phút
          mode: box

play_personal_mix:
  name: Phát Mix cá nhân
  description: Tạo và phát Mix YouTube dựa trên hồ sơ nghe lưu cục bộ của add-on.
  fields:
    config_entry_id:
      name: Config entry
      selector:
        config_entry:
          integration: youtube_pro
    entity_id:
      name: Thiết bị phát
      required: true
      selector:
        entity:
          domain: media_player
    profile_id:
      name: Hồ sơ nghe
      description: Để trống để dùng hồ sơ đang chọn.
      selector:
        text:
    media_kind:
      name: Loại nội dung
      default: audio
      selector:
        select:
          options:
            - audio
            - video
    limit:
      name: Số bài
      default: 24
      selector:
        number:
          min: 5
          max: 30
          mode: box
    shuffle:
      name: Phát ngẫu nhiên
      default: true
      selector:
        boolean:
    refresh:
      name: Tạo lại đề xuất
      default: false
      selector:
        boolean:

listener_feedback:
  name: Ghi nhận gu nghe YouTube
  description: Thích, không thích hoặc ẩn bài/kênh để cải thiện Mix cá nhân.
  fields:
    config_entry_id:
      name: Config entry
      selector:
        config_entry:
          integration: youtube_pro
    action:
      name: Hành động
      required: true
      selector:
        select:
          options:
            - like
            - dislike
            - block_track
            - block_channel
            - undo
    profile_id:
      name: Hồ sơ nghe
      selector:
        text:
    url:
      name: URL YouTube
      selector:
        text:
          type: url
    title:
      name: Tiêu đề
      selector:
        text:
    channel:
      name: Kênh
      selector:
        text:
    channel_url:
      name: URL kênh
      selector:
        text:
          type: url
    thumbnail:
      name: Thumbnail
      selector:
        text:
          type: url
    media_kind:
      name: Loại nội dung
      default: audio
      selector:
        select:
          options:
            - audio
            - video
